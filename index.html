<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Affranchi</title>
<link rel="icon" type="image/png" href="assets/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Karla', -apple-system, 'Segoe UI', sans-serif;
    background-color: #EDF5FE;
    background-image: url('assets/background.svg');
    background-repeat: no-repeat;
    background-position: 0% 100%;
    background-size: auto;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 40px;
  }
  .avatar-wrap {
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(147, 51, 234, 0.30), 0 0 28px rgba(236, 72, 153, 0.45);
  }
  .avatar {
    display: block;
    width: 108px;
    height: 108px;
    border-radius: 50%;
  }
  .title {
    margin-top: 18px;
    font-size: 30px;
    font-weight: 700;
    color: #111111;
    text-align: center;
  }
  .bio {
    margin-top: 8px;
    font-size: 18px;
    font-weight: 400;
    color: #333333;
    line-height: 24px;
    text-align: center;
  }
  .links {
    width: min(470px, 92vw);
    margin-top: 26px;
  }
  .links a {
    display: block;
    background: #FFFFFF;
    border: 2px solid rgba(1, 77, 130, 0);
    border-radius: 4px;
    box-shadow: rgba(0, 0, 0, 0.4) 0px 1px 5px 0px;
    padding: 14px 90px;
    margin-bottom: 24px;
    text-align: center;
    text-decoration: none;
    color: #000000;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .links a:hover {
    transform: translateY(-2px);
    box-shadow: rgba(0, 0, 0, 0.35) 0px 4px 12px 0px;
  }
  .links a:last-child { margin-bottom: 0; }
  .link-icon {
    display: block;
    font-size: 28px;
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .link-title {
    display: block;
    font-size: 18px;
    font-weight: 700;
    color: #000000;
  }
  .link-sub {
    display: block;
    margin-top: 2px;
    font-size: 15px;
    font-weight: 400;
    color: #555555;
  }
  @media (max-width: 520px) {
    .links a { padding: 14px 24px; }
    .page { padding-top: 40px; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="avatar-wrap">
      <img class="avatar" src="assets/avatar.png" alt="@DevAffranchi">
    </div>
    <h1 class="title">@DevAffranchi</h1>
    <p class="bio">Je t'aide à créer des applications mobiles</p>
    <div class="links">
      <a href="https://tidycal.com/dha/consulting">
        <span class="link-icon">📞</span>
        <span class="link-title">Consulting privé</span>
      </a>
      <a href="https://www.youtube.com/@DevAffranchi">
        <span class="link-icon">▶️</span>
        <span class="link-title">Youtube Dev Affranchi</span>
      </a>
    </div>
  </div>
</body>
</html>
